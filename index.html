<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Acesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cartao">
    <h1>Validador de Acesso</h1>

    <p class="instrucao">
      Informe seu nome e sua idade para consultar sua situação.
    </p>

    <label for="campoNome">Nome completo:</label>
    <input type="text" id="campoNome" placeholder="Ex: João da Silva">

    <label for="campoIdade">Idade:</label>
    <input type="number" id="campoIdade" placeholder="Ex: 20" min="0">

    <button onclick="verificarIdade()">Verificar Situação</button>

    <p id="mensagemResultado">
      Digite seu nome e sua idade e clique no botão acima.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
